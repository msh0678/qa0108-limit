<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="누르면 숫자가 1씩 오르는 QA 한도 시험용 작은 페이지">
  <title>QA 한도 시험</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="card">
    <h1>QA 한도 시험</h1>
    <p class="desc">버튼을 누를 때마다 숫자가 1씩 올라갑니다.</p>
    <p class="count" aria-live="polite">현재 숫자: <strong id="num">0</strong></p>
    <button id="plusBtn" type="button">1 올리기</button>
    <p class="note">숫자는 이 기기 브라우저에만 저장됩니다.</p>
  </main>
  <script src="./js/app.js"></script>

<!--ethos-badge--><div style="text-align:center;padding:16px 8px 20px;font:12px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#9aa1a9">이 페이지는 <a href="https://ethos.ai.kr" target="_blank" rel="noopener" style="color:#8a919b;text-decoration:underline">에토스AI 코드</a>로 만들어졌습니다</div>
</body>
</html>
